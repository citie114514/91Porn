<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<title>91官方网站</title>
<style>
/* === 全局重置 === */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

html,body{
  width:100%;height:100%;
  overflow:hidden;
  background:#0a0a0f;
  /* ✅ 系统字体兜底，不依赖 Google Fonts 网络 */
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:#f1f1f1;
}

/* === 粒子背景 === */
#bg-canvas{
  position:fixed;
  /* ✅ 修复: inset:0 → 四个方向明确写出 */
  top:0;left:0;right:0;bottom:0;
  z-index:0;
  pointer-events:none;
  opacity:0.25;
}

/* === 年龄验证弹窗 === */
#age-modal{
  position:fixed;
  /* ✅ 修复: inset:0 → 四个方向明确写出 */
  top:0;left:0;right:0;bottom:0;
  width:100%;height:100%;
  display:-webkit-box;
  display:-webkit-flex;
  display:flex;
  -webkit-box-align:center;
  -webkit-align-items:center;
  align-items:center;
  -webkit-box-pack:center;
  -webkit-justify-content:center;
  justify-content:center;
  z-index:9000;
  background:rgba(0,0,0,0.88);
  -webkit-animation:fadeIn 0.4s ease;
  animation:fadeIn 0.4s ease;
}

.modal-box{
  position:relative;
  background:#12121e;
  border:1px solid rgba(255,255,255,0.09);
  border-radius:20px;
  /* ✅ 修复: clamp() → 固定值 + padding 自适应 */
  padding:32px 28px;
  /* ✅ 修复: min() → 普通 max-width + width */
  width:92%;
  max-width:440px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,0.75);
  -webkit-animation:slideUp 0.45s cubic-bezier(0.17,0.67,0.35,1.28);
  animation:slideUp 0.45s cubic-bezier(0.17,0.67,0.35,1.28);
}

@media(max-width:400px){
  .modal-box{padding:24px 18px}
}

.modal-badge{
  display:inline-block;
  background:#e63946;
  color:#fff;
  font-size:11px;
  letter-spacing:1px;
  text-transform:uppercase;
  padding:4px 12px;
  border-radius:99px;
  margin-bottom:16px;
}

.modal-box h2{
  /* ✅ 修复: clamp() → 固定值 */
  font-size:24px;
  font-weight:700;
  color:#ffffff;
  margin-bottom:12px;
  letter-spacing:0.02em;
}

@media(min-width:480px){
  .modal-box h2{font-size:28px}
}

.modal-box .sub{
  font-size:14px;
  color:#9a9ab0;
  line-height:1.8;
  margin-bottom:26px;
}
.modal-box .sub strong{color:#2ec4b6}

.modal-actions{
  display:-webkit-box;
  display:-webkit-flex;
  display:flex;
  gap:12px;
  -webkit-box-pack:center;
  -webkit-justify-content:center;
  justify-content:center;
  -webkit-flex-wrap:wrap;
  flex-wrap:wrap;
}

.btn{
  -webkit-box-flex:1;
  -webkit-flex:1;
  flex:1;
  max-width:160px;
  min-width:120px;
  padding:13px 0;
  border:none;
  border-radius:10px;
  font-size:15px;
  font-weight:600;
  font-family:inherit;
  cursor:pointer;
  -webkit-transition:opacity 0.15s,-webkit-transform 0.15s;
  transition:opacity 0.15s,transform 0.15s;
  /* ✅ 确保按钮可点击 */
  position:relative;
  z-index:1;
  -webkit-tap-highlight-color:transparent;
}
.btn:hover{opacity:0.9}
.btn:active{-webkit-transform:scale(0.95);transform:scale(0.95)}

.btn-yes{background:#2ec4b6;color:#fff}
.btn-no {background:#e63946;color:#fff}

.modal-note{
  margin-top:18px;
  font-size:11px;
  color:rgba(154,154,176,0.4);
}

/* === 加载中 === */
#loader{
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  width:100%;height:100%;
  display:none;
  -webkit-box-orient:vertical;
  -webkit-box-direction:normal;
  -webkit-flex-direction:column;
  flex-direction:column;
  -webkit-box-align:center;
  -webkit-align-items:center;
  align-items:center;
  -webkit-box-pack:center;
  -webkit-justify-content:center;
  justify-content:center;
  gap:16px;
  z-index:8000;
  background:#0a0a0f;
}

.ring{
  width:50px;height:50px;
  border:3px solid rgba(255,255,255,0.1);
  border-top-color:#2ec4b6;
  border-right-color:#e63946;
  border-radius:50%;
  -webkit-animation:spin 0.85s linear infinite;
  animation:spin 0.85s linear infinite;
}

#loader-txt{
  font-size:13px;
  color:#9a9ab0;
  letter-spacing:0.04em;
}

/* === 错误提示 === */
#error-box{
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  width:100%;height:100%;
  display:none;
  -webkit-box-orient:vertical;
  -webkit-box-direction:normal;
  -webkit-flex-direction:column;
  flex-direction:column;
  -webkit-box-align:center;
  -webkit-align-items:center;
  align-items:center;
  -webkit-box-pack:center;
  -webkit-justify-content:center;
  justify-content:center;
  gap:14px;
  z-index:8500;
  background:#0a0a0f;
  padding:30px;
  text-align:center;
}
#error-box h3{color:#e63946;font-size:18px}
#error-box p{color:#9a9ab0;font-size:14px;max-width:340px;line-height:1.7}
#err-reload{
  padding:10px 24px;background:#2ec4b6;color:#fff;
  border:none;border-radius:8px;font-family:inherit;
  cursor:pointer;font-size:14px;
}

/* === 播放区 === */
#player-wrap{
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  width:100%;height:100%;
  display:none;
  -webkit-box-align:center;
  -webkit-align-items:center;
  align-items:center;
  -webkit-box-pack:center;
  -webkit-justify-content:center;
  justify-content:center;
  background:#000;
  z-index:700;
}

#main-video{
  width:100%;height:100%;
  -o-object-fit:contain;
  object-fit:contain;
  background:#000;
  outline:none;
}

@media(orientation:portrait) and (max-width:768px){
  #main-video{-o-object-fit:cover;object-fit:cover}
}

/* === 进度条 === */
#prog-wrap{
  position:fixed;
  bottom:0;left:0;right:0;
  height:3px;
  background:rgba(255,255,255,0.08);
  z-index:9600;
  cursor:pointer;
  display:none;
}
#prog-bar{
  height:100%;
  background:-webkit-linear-gradient(left,#2ec4b6,#e63946);
  background:linear-gradient(to right,#2ec4b6,#e63946);
  width:0;
  -webkit-transition:width 0.2s linear;
  transition:width 0.2s linear;
}

/* === 控制栏 === */
#ctrl-bar{
  position:fixed;
  bottom:18px;
  left:50%;
  -webkit-transform:translateX(-50%);
  transform:translateX(-50%);
  display:none;
  -webkit-box-align:center;
  -webkit-align-items:center;
  align-items:center;
  gap:8px;
  background:rgba(8,8,14,0.88);
  border:1px solid rgba(255,255,255,0.1);
  padding:8px 16px;
  border-radius:99px;
  z-index:9500;
  white-space:nowrap;
}

.cbtn{
  background:transparent;
  border:none;
  cursor:pointer;
  color:rgba(255,255,255,0.72);
  font-size:17px;
  padding:5px 6px;
  border-radius:6px;
  line-height:1;
  -webkit-transition:color 0.1s,background 0.1s;
  transition:color 0.1s,background 0.1s;
  -webkit-tap-highlight-color:transparent;
}
.cbtn:hover,.cbtn:active{color:#fff;background:rgba(255,255,255,0.12)}

#vol-sl{
  -webkit-appearance:none;
  appearance:none;
  width:72px;height:4px;
  border-radius:2px;
  background:rgba(255,255,255,0.2);
  outline:none;cursor:pointer;
  vertical-align:middle;
}
#vol-sl::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:14px;height:14px;
  border-radius:50%;
  background:#2ec4b6;
  cursor:pointer;
}

.sep{width:1px;height:16px;background:rgba(255,255,255,0.12);display:inline-block;vertical-align:middle}

/* === 播放列表 === */
#playlist{
  position:fixed;
  top:0;right:0;
  width:255px;
  height:100%;
  background:rgba(10,10,18,0.96);
  border-left:1px solid rgba(255,255,255,0.08);
  z-index:9100;
  display:none;
  -webkit-box-orient:vertical;
  -webkit-box-direction:normal;
  -webkit-flex-direction:column;
  flex-direction:column;
  -webkit-transform:translateX(100%);
  transform:translateX(100%);
  -webkit-transition:-webkit-transform 0.32s ease;
  transition:transform 0.32s ease;
}
@media(max-width:400px){#playlist{width:88%}}
#playlist.open{-webkit-transform:translateX(0);transform:translateX(0)}

#pl-hdr{
  padding:14px 16px;font-size:13px;color:#9a9ab0;
  border-bottom:1px solid rgba(255,255,255,0.06);
  display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-box-align:center;-webkit-align-items:center;align-items:center;
  -webkit-box-pack:justify;-webkit-justify-content:space-between;justify-content:space-between;
}
#pl-hdr span{color:#f1f1f1;font-size:15px}

#pl-body{-webkit-box-flex:1;-webkit-flex:1;flex:1;overflow-y:auto;padding:6px 0}
#pl-body::-webkit-scrollbar{width:4px}
#pl-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.14);border-radius:2px}

.pi{
  display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-box-align:center;-webkit-align-items:center;align-items:center;
  gap:10px;padding:12px 16px;cursor:pointer;
  border-bottom:1px solid rgba(255,255,255,0.04);
  -webkit-transition:background 0.12s;transition:background 0.12s;
}
.pi:hover,.pi:active{background:rgba(255,255,255,0.06)}
.pi.act{background:rgba(46,196,182,0.12);border-left:3px solid #2ec4b6}
.pi-n{
  -webkit-flex-shrink:0;flex-shrink:0;
  width:26px;height:26px;border-radius:50%;
  background:rgba(255,255,255,0.08);
  display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-box-align:center;-webkit-align-items:center;align-items:center;
  -webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;
  font-size:11px;color:#9a9ab0;
}
.pi-nm{font-size:13px;color:#f1f1f1;line-height:1.4;
  overflow:hidden;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical}
.pi-sz{font-size:11px;color:#9a9ab0;margin-top:2px}

/* === 动画关键帧 === */
@-webkit-keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

@-webkit-keyframes slideUp{
  from{opacity:0;-webkit-transform:translateY(24px) scale(0.95);transform:translateY(24px) scale(0.95)}
  to{opacity:1;-webkit-transform:none;transform:none}
}
@keyframes slideUp{
  from{opacity:0;transform:translateY(24px) scale(0.95)}
  to{opacity:1;transform:none}
}

@-webkit-keyframes spin{to{-webkit-transform:rotate(360deg);transform:rotate(360deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<!-- 年龄验证弹窗 -->
<div id="age-modal">
  <div class="modal-box">
    <div class="modal-badge">&#9888; 内容警告</div>
    <h2>年龄验证</h2>
    <p class="sub">
      本网站含有仅适合 <strong>18岁及以上</strong> 成年人的内容。<br>
      继续访问即表示您确认已达法定年龄，<br>并同意相关服务条款与法律法规。
    </p>
    <div class="modal-actions">
      <button class="btn btn-yes" id="yes-btn">&#10004; 我已满18岁</button>
      <button class="btn btn-no"  id="no-btn">&#10008; 未满18岁</button>
    </div>
    <div class="modal-note">根据《网络安全法》等相关法律法规要求</div>
  </div>
</div>

<!-- 加载中 -->
<div id="loader">
  <div class="ring"></div>
  <div id="loader-txt">正在读取 GitHub Release…</div>
</div>

<!-- 错误提示 -->
<div id="error-box">
  <h3>&#9888; 加载失败</h3>
  <p id="err-msg">无法获取视频列表，请检查仓库配置。</p>
  <button id="err-reload">重新加载</button>
</div>

<!-- 播放区 -->
<div id="player-wrap">
  <video id="main-video" autoplay playsinline webkit-playsinline preload="auto" muted></video>
</div>

<!-- 进度条 -->
<div id="prog-wrap"><div id="prog-bar"></div></div>

<!-- 控制栏 -->
<div id="ctrl-bar">
  <button class="cbtn" id="b-prev">&#9198;</button>
  <button class="cbtn" id="b-play">&#9208;</button>
  <button class="cbtn" id="b-next">&#9197;</button>
  <span class="sep"></span>
  <button class="cbtn" id="b-mute">&#128266;</button>
  <input type="range" id="vol-sl" min="0" max="1" step="0.02" value="1"/>
  <span class="sep"></span>
  <button class="cbtn" id="b-list">&#9776;</button>
  <button class="cbtn" id="b-fs">&#9974;</button>
</div>

<!-- 播放列表 -->
<div id="playlist">
  <div id="pl-hdr">
    <span>&#128193; 视频列表</span>
    <button class="cbtn" id="b-cls" style="font-size:13px">&#10005;</button>
  </div>
  <div id="pl-body"></div>
</div>

<script>
/* ============================================================
   ★ 配置区 — 只改这里
   ============================================================ */
var CONFIG = {
  repo:  "citie114514/RickBait",   // owner/repo
  tag:   "latest",                 // "latest" 或具体标签 "v1.0"
  token: "",                       // 公开仓库留空
  exts:  [".mp4",".m4v",".webm",".mov",".mkv"]
};
/* ============================================================ */

var playlist = [];
var curIdx   = 0;

/* 工具函数 */
function gid(id){ return document.getElementById(id); }

function show(id,flex){
  gid(id).style.display = flex ? 'flex' : 'block';
}
function hide(id){
  gid(id).style.display = 'none';
}

function fmtSize(b){
  if(!b) return '';
  if(b < 1048576)   return (b/1024).toFixed(1) + 'KB';
  if(b < 1073741824) return (b/1048576).toFixed(1) + 'MB';
  return (b/1073741824).toFixed(2) + 'GB';
}

/* 安全关闭 */
function secureClose(){
  document.documentElement.style.opacity = '0';
  document.body.style.pointerEvents = 'none';
  setTimeout(function(){
    try{
      if(window.history.length <= 1){ window.close(); }
      else { window.open('','_self').close(); }
      setTimeout(function(){
        if(!window.closed){
          if(/iPad|iPhone|iPod/.test(navigator.userAgent)){
            document.body.innerHTML = '<p style="color:#fff;text-align:center;padding:50px;font-size:16px">请手动关闭本页面</p>';
          } else {
            window.location.replace('about:blank');
          }
        }
      }, 150);
    } catch(e){ window.location.href = 'about:blank'; }
  }, 280);
}

/* 粒子背景 */
(function(){
  var c   = gid('bg-canvas');
  var ctx = c.getContext('2d');

  function resize(){
    c.width  = window.innerWidth;
    c.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  var pts = [];
  for(var i = 0; i < 50; i++){
    pts.push({
      x:  Math.random() * window.innerWidth,
      y:  Math.random() * window.innerHeight,
      r:  Math.random() * 1.5 + 0.3,
      vx: (Math.random() - 0.5) * 0.28,
      vy: (Math.random() - 0.5) * 0.28
    });
  }

  function loop(){
    ctx.clearRect(0, 0, c.width, c.height);
    for(var i = 0; i < pts.length; i++){
      var p = pts[i];
      p.x += p.vx; p.y += p.vy;
      if(p.x < 0)        p.x = c.width;
      if(p.x > c.width)  p.x = 0;
      if(p.y < 0)        p.y = c.height;
      if(p.y > c.height) p.y = 0;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(180,180,255,0.55)';
      ctx.fill();
    }
    requestAnimationFrame(loop);
  }
  loop();
})();

/* GitHub Release 视频列表 */
function fetchVideos(){
  var headers = { 'Accept': 'application/vnd.github+json' };
  if(CONFIG.token) headers['Authorization'] = 'Bearer ' + CONFIG.token;

  var apiUrl = (CONFIG.tag === 'latest')
    ? 'https://api.github.com/repos/' + CONFIG.repo + '/releases/latest'
    : 'https://api.github.com/repos/' + CONFIG.repo + '/releases/tags/' + CONFIG.tag;

  return fetch(apiUrl, { headers: headers })
    .then(function(res){
      if(!res.ok){
        var msg = 'GitHub API 错误 ' + res.status;
        if(res.status === 404) msg = 'Release 不存在，请先在 GitHub 创建 Release 并上传 .mp4';
        if(res.status === 403) msg = 'API 请求频率超限，请稍后刷新，或在 CONFIG 填入 Token';
        if(res.status === 401) msg = 'Token 无效，请重新生成';
        throw new Error(msg);
      }
      return res.json();
    })
    .then(function(data){
      var assets = (data.assets || []).filter(function(a){
        var n = a.name.toLowerCase();
        return CONFIG.exts.some(function(ext){ return n.slice(-ext.length) === ext; });
      });
      if(assets.length === 0){
        throw new Error(
          'Release "' + data.tag_name + '" 中没有视频文件。\n' +
          '请上传 .mp4 文件到 Release Assets。'
        );
      }
      return assets.map(function(a){
        return { name: a.name, url: a.browser_download_url, size: fmtSize(a.size) };
      });
    });
}

/* 渲染播放列表 */
function renderList(){
  var body = gid('pl-body');
  body.innerHTML = '';
  for(var i = 0; i < playlist.length; i++){
    (function(idx){
      var v   = playlist[idx];
      var div = document.createElement('div');
      div.className = 'pi' + (idx === curIdx ? ' act' : '');
      div.innerHTML =
        '<div class="pi-n">' + (idx + 1) + '</div>' +
        '<div><div class="pi-nm">' + v.name + '</div>' +
        '<div class="pi-sz">' + v.size + '</div></div>';
      div.addEventListener('click', function(){ loadVideo(idx); });
      body.appendChild(div);
    })(i);
  }
}

/* 加载视频 */
function loadVideo(idx){
  curIdx = ((idx % playlist.length) + playlist.length) % playlist.length;
  var video = gid('main-video');
  video.src = playlist[curIdx].url;
  video.load();

  /* 先静音播 → 用户操作后尝试解除静音 */
  video.muted = true;
  var playPromise = video.play();
  if(playPromise && typeof playPromise.then === 'function'){
    playPromise.then(function(){
      video.muted  = false;
      video.volume = 1;
      gid('b-mute').innerHTML = '&#128266;';
      gid('vol-sl').value = 1;
    }).catch(function(){
      video.muted = true;
      gid('b-mute').innerHTML = '&#128263;';
    });
  }

  gid('b-play').innerHTML = '&#9208;';
  renderList();

  var items = document.querySelectorAll('.pi');
  if(items[curIdx]){
    items[curIdx].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

/* 启动 */
function startPlayback(){
  show('loader', true);
  gid('loader-txt').textContent = '正在读取 GitHub Release…';

  fetchVideos()
    .then(function(list){
      playlist = list;
      hide('loader');
      show('player-wrap', true);
      show('ctrl-bar', true);
      show('prog-wrap');
      show('playlist', true);
      loadVideo(0);
      initControls();
    })
    .catch(function(err){
      hide('loader');
      gid('err-msg').textContent = err.message;
      show('error-box', true);
    });
}

/* 控制栏 */
function initControls(){
  var video    = gid('main-video');
  var progBar  = gid('prog-bar');
  var progWrap = gid('prog-wrap');

  video.addEventListener('timeupdate', function(){
    if(video.duration){
      progBar.style.width = (video.currentTime / video.duration * 100) + '%';
    }
  });

  progWrap.addEventListener('click', function(e){
    if(!video.duration) return;
    video.currentTime = (e.offsetX / progWrap.offsetWidth) * video.duration;
  });

  video.addEventListener('ended', function(){ loadVideo(curIdx + 1); });

  gid('b-play').addEventListener('click', function(){
    if(video.paused){
      video.play();
      gid('b-play').innerHTML = '&#9208;';
    } else {
      video.pause();
      gid('b-play').innerHTML = '&#9654;';
    }
  });

  gid('b-prev').addEventListener('click', function(){ loadVideo(curIdx - 1); });
  gid('b-next').addEventListener('click', function(){ loadVideo(curIdx + 1); });

  gid('b-mute').addEventListener('click', function(){
    video.muted = !video.muted;
    gid('b-mute').innerHTML = video.muted ? '&#128263;' : '&#128266;';
  });

  var volSl = gid('vol-sl');
  volSl.addEventListener('input', function(){
    video.volume = parseFloat(this.value);
    video.muted  = (this.value == 0);
    gid('b-mute').innerHTML = video.muted ? '&#128263;' : '&#128266;';
  });

  gid('b-fs').addEventListener('click', function(){
    var el  = gid('player-wrap');
    var req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
    var ex  = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen;
    if(!document.fullscreenElement && !document.webkitFullscreenElement){
      if(req) req.call(el);
    } else {
      if(ex) ex.call(document);
    }
  });

  gid('b-list').addEventListener('click', function(){
    gid('playlist').classList.toggle('open');
  });
  gid('b-cls').addEventListener('click', function(){
    gid('playlist').classList.remove('open');
  });

  document.addEventListener('keydown', function(e){
    if(e.key === ' ' && e.target.tagName !== 'INPUT'){
      e.preventDefault();
      if(video.paused){ video.play();  gid('b-play').innerHTML = '&#9208;'; }
      else            { video.pause(); gid('b-play').innerHTML = '&#9654;'; }
    }
    if(e.key === 'ArrowRight') loadVideo(curIdx + 1);
    if(e.key === 'ArrowLeft')  loadVideo(curIdx - 1);
  });

  window.addEventListener('orientationchange', function(){
    setTimeout(function(){
      var angle = screen.orientation ? screen.orientation.angle : window.orientation;
      video.style.objectFit = (angle % 180 !== 0) ? 'cover' : 'contain';
    }, 300);
  });
}

/* 入口 */
document.addEventListener('DOMContentLoaded', function(){
  gid('yes-btn').addEventListener('click', function(){
    var modal = gid('age-modal');
    modal.style.transition = 'opacity 0.3s';
    modal.style.opacity    = '0';
    setTimeout(function(){ hide('age-modal'); startPlayback(); }, 300);
  });

  gid('no-btn').addEventListener('click', function(){
    alert('根据相关法律法规，未满18岁用户无法访问此内容。');
    secureClose();
  });

  gid('err-reload').addEventListener('click', function(){ location.reload(); });

  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') secureClose();
  });
});
</script>
</body>
</html>
