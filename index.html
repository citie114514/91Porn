<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="referrer" content="no-referrer"/>
<title>91官方网站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== 主题变量 ===== */
:root{
  --bg:       #06060f;
  --bg2:      #0d0d1c;
  --surface:  rgba(255,255,255,0.04);
  --border:   rgba(255,255,255,0.08);
  --teal:     #00d4c8;
  --teal2:    #00a89f;
  --coral:    #ff4757;
  --coral2:   #cc2f3f;
  --text:     #f0f0f8;
  --muted:    rgba(200,200,220,0.55);
  --ff-head:  'Syne', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --ff-body:  'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --radius:   18px;
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--ff-body);-webkit-font-smoothing:antialiased}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.14);border-radius:99px}

/* ===== 粒子背景 ===== */
#bg-canvas{
  position:fixed;inset:0;z-index:0;pointer-events:none;
}

/* 噪点纹理叠加 */
body::before{
  content:'';position:fixed;inset:0;z-index:1;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  opacity:0.5;
}

/* ===== 年龄验证弹窗 ===== */
#age-modal{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  z-index:9000;padding:20px;
  background:radial-gradient(ellipse at 50% 50%, rgba(0,212,200,0.07) 0%, rgba(6,6,15,0.97) 70%);
  backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);
  animation:fadeIn 0.5s ease;
}

.modal-box{
  position:relative;
  width:100%;max-width:460px;
  background:linear-gradient(180deg,rgba(20,20,40,0.95),rgba(13,13,28,0.95));
  border:1px solid rgba(0,212,200,0.2);
  border-radius:24px;
  padding:44px 36px 32px;
  text-align:center;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.04),
    0 30px 80px rgba(0,0,0,0.8),
    0 0 80px rgba(0,212,200,0.08),
    inset 0 1px 0 rgba(255,255,255,0.06);
  animation:slideUp 0.55s cubic-bezier(0.17,0.67,0.35,1.2);
  overflow:hidden;
}

/* 顶部渐变光线 */
.modal-box::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--teal),transparent);
}
/* 顶部辉光 */
.modal-box::after{
  content:'';position:absolute;top:-80px;left:50%;transform:translateX(-50%);
  width:240px;height:240px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,212,200,0.1) 0%,transparent 70%);
  pointer-events:none;
}

.modal-icon{
  width:64px;height:64px;
  border-radius:50%;
  background:linear-gradient(135deg,rgba(0,212,200,0.18),rgba(255,71,87,0.12));
  border:1px solid rgba(0,212,200,0.3);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 22px;
  font-size:26px;
  box-shadow:0 0 30px rgba(0,212,200,0.15);
}

.modal-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,rgba(255,71,87,0.22),rgba(255,71,87,0.08));
  border:1px solid rgba(255,71,87,0.35);
  color:var(--coral);
  font-size:10px;font-weight:700;
  letter-spacing:2.5px;text-transform:uppercase;
  padding:6px 16px;border-radius:99px;
  margin-bottom:20px;
  font-family:var(--ff-head);
}

.modal-box h2{
  font-family:var(--ff-head);
  font-size:30px;font-weight:800;
  color:#fff;
  margin-bottom:14px;
  letter-spacing:-0.01em;
  background:linear-gradient(135deg,#fff 60%,rgba(0,212,200,0.85));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}

.modal-box .sub{
  font-size:13.5px;color:var(--muted);
  line-height:1.85;margin-bottom:30px;
  font-family:var(--ff-body);
}
.modal-box .sub strong{
  color:var(--teal);font-weight:500;
}

.modal-actions{
  display:flex;gap:12px;justify-content:center;flex-wrap:wrap;
}

.btn{
  flex:1;max-width:180px;min-width:130px;
  padding:14px 0;border:none;border-radius:12px;
  font-size:14px;font-weight:700;letter-spacing:0.03em;
  font-family:var(--ff-head);
  cursor:pointer;position:relative;z-index:1;
  -webkit-tap-highlight-color:transparent;
  transition:transform 0.15s,box-shadow 0.15s,opacity 0.15s,background 0.15s;
  overflow:hidden;
}
.btn::after{
  content:'';position:absolute;inset:0;
  background:rgba(255,255,255,0);
  transition:background 0.15s;
}
.btn:hover::after{background:rgba(255,255,255,0.08)}
.btn:active{transform:scale(0.96)}

.btn-yes{
  background:linear-gradient(135deg,var(--teal),var(--teal2));
  color:#001a18;
  box-shadow:0 4px 22px rgba(0,212,200,0.35);
}
.btn-yes:hover{box-shadow:0 8px 32px rgba(0,212,200,0.5)}

.btn-no{
  background:transparent;
  border:1px solid rgba(255,71,87,0.45);
  color:var(--coral);
}
.btn-no:hover{border-color:var(--coral);background:rgba(255,71,87,0.08)}

.modal-note{
  margin-top:24px;font-size:10.5px;
  color:rgba(200,200,220,0.28);
  letter-spacing:0.04em;
  font-family:var(--ff-body);
}

/* ===== 加载层 ===== */
#loader{
  position:fixed;inset:0;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;
  z-index:8000;background:var(--bg);
}
.loader-inner{display:flex;flex-direction:column;align-items:center;gap:18px}

.ring-wrap{position:relative;width:56px;height:56px}
.ring{
  position:absolute;inset:0;
  border-radius:50%;
  border:2px solid transparent;
  border-top-color:var(--teal);
  animation:spin 1s linear infinite;
}
.ring-outer{
  border-width:1px;
  border-top-color:rgba(255,71,87,0.5);
  animation-duration:1.5s;animation-direction:reverse;
}
.ring-dot{
  position:absolute;top:50%;left:50%;
  width:6px;height:6px;border-radius:50%;margin:-3px;
  background:var(--teal);
  box-shadow:0 0 12px var(--teal);
}

#loader-txt{
  font-family:var(--ff-head);
  font-size:12px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;
  color:var(--muted);
}

/* ===== 错误层 ===== */
#error-box{
  position:fixed;inset:0;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;
  z-index:8500;background:var(--bg);padding:30px;text-align:center;
}
.error-icon{font-size:40px;margin-bottom:4px}
#error-box h3{
  font-family:var(--ff-head);
  color:var(--coral);font-size:20px;font-weight:700;letter-spacing:0.03em;
}
#error-box p{color:var(--muted);font-size:13px;max-width:360px;line-height:1.7;white-space:pre-line}
#err-reload{
  margin-top:6px;
  padding:12px 30px;
  background:linear-gradient(135deg,var(--teal),var(--teal2));
  color:#001a18;border:none;border-radius:10px;
  font-family:var(--ff-head);
  cursor:pointer;font-size:13px;font-weight:700;letter-spacing:0.05em;
  box-shadow:0 4px 18px rgba(0,212,200,0.35);
  transition:transform 0.15s,box-shadow 0.15s;
}
#err-reload:hover{transform:translateY(-1px);box-shadow:0 6px 26px rgba(0,212,200,0.5)}

/* ===== 播放器（原生 video） ===== */
#player-wrap{
  position:fixed;inset:0;display:none;
  align-items:center;justify-content:center;
  background:#000;z-index:700;
}
#main-video{
  width:100%;height:100%;object-fit:contain;background:#000;outline:none;
}
@media(orientation:portrait) and (max-width:768px){
  #main-video{object-fit:cover}
}

/* ===== 动画 ===== */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{
  from{opacity:0;transform:translateY(30px) scale(0.96)}
  to{opacity:1;transform:none}
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<!-- 年龄验证 -->
<div id="age-modal">
  <div class="modal-box">
    <div class="modal-icon">🔞</div>
    <div class="modal-badge">⚠ 内容警告</div>
    <h2>年龄验证</h2>
    <p class="sub">
      本网站含有仅适合 <strong>18岁及以上</strong> 成年人的内容。<br>
      继续访问即表示您确认已达法定年龄，<br>并同意相关服务条款与法律法规。
    </p>
    <div class="modal-actions">
      <button class="btn btn-yes" id="yes-btn">✓ 我已满18岁</button>
      <button class="btn btn-no"  id="no-btn">✕ 未满18岁</button>
    </div>
    <div class="modal-note">根据《网络安全法》等相关法律法规要求</div>
  </div>
</div>

<!-- 加载中 -->
<div id="loader">
  <div class="loader-inner">
    <div class="ring-wrap">
      <div class="ring ring-outer"></div>
      <div class="ring"></div>
      <div class="ring-dot"></div>
    </div>
    <div id="loader-txt">正在读取 GitHub Release…</div>
  </div>
</div>

<!-- 错误提示 -->
<div id="error-box">
  <div class="error-icon">⚠</div>
  <h3>加载失败</h3>
  <p id="err-msg">无法获取视频列表，请检查仓库配置。</p>
  <button id="err-reload">重新加载</button>
</div>

<!-- 播放区（原生 video 控件） -->
<div id="player-wrap">
  <video id="main-video" controls autoplay playsinline webkit-playsinline preload="auto"></video>
</div>

<script>
/* ============================================================
   ★ 配置区 — 只改这里
   说明：
   - 仓库为公开仓库时，token 留空即可（匿名调用 GitHub API，
     限速 60 次/小时/IP，对个人整蛊页面足够用）。
   - 切勿在客户端代码中硬编码 GitHub Personal Access Token，
     任何人都能通过 F12 直接读取并盗用你的 token。
   - 仅当仓库为私有时才需要 token，且应通过后端代理转发请求。
   ============================================================ */
var CONFIG = {
  repo:  "citie114514/91",       /* 已更新为新仓库名（原 RickBait 已重命名） */
  tag:    "latest",
  token: "",                     /* 公开仓库无需填写 */
  exts:   [".mp4",".m4v",".webm",".mov",".mkv"]
};
/* ============================================================ */

function gid(id){ return document.getElementById(id); }
function show(id,flex){ gid(id).style.display = flex ? 'flex' : 'block'; }
function hide(id){ gid(id).style.display = 'none'; }
function fmtSize(b){
  if(!b) return '';
  if(b < 1048576)    return (b/1024).toFixed(1) + ' KB';
  if(b < 1073741824) return (b/1048576).toFixed(1) + ' MB';
  return (b/1073741824).toFixed(2) + ' GB';
}

/* ===== 粒子背景（带连线） ===== */
(function(){
  var c   = gid('bg-canvas');
  var ctx = c.getContext('2d');

  function resize(){
    c.width  = window.innerWidth;
    c.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  var N = 60;
  var pts = [];
  for(var i = 0; i < N; i++){
    pts.push({
      x:  Math.random() * window.innerWidth,
      y:  Math.random() * window.innerHeight,
      r:  Math.random() * 1.2 + 0.3,
      vx: (Math.random() - 0.5) * 0.22,
      vy: (Math.random() - 0.5) * 0.22
    });
  }

  var LINK_DIST = 110;

  function loop(){
    ctx.clearRect(0, 0, c.width, c.height);

    for(var i = 0; i < pts.length; i++){
      var p = pts[i];
      p.x += p.vx; p.y += p.vy;
      if(p.x < 0) p.x = c.width;
      if(p.x > c.width) p.x = 0;
      if(p.y < 0) p.y = c.height;
      if(p.y > c.height) p.y = 0;
    }

    /* 连线 */
    for(var i = 0; i < pts.length; i++){
      for(var j = i+1; j < pts.length; j++){
        var dx = pts[i].x - pts[j].x;
        var dy = pts[i].y - pts[j].y;
        var d  = Math.sqrt(dx*dx + dy*dy);
        if(d < LINK_DIST){
          var a = (1 - d / LINK_DIST) * 0.14;
          ctx.beginPath();
          ctx.moveTo(pts[i].x, pts[i].y);
          ctx.lineTo(pts[j].x, pts[j].y);
          ctx.strokeStyle = 'rgba(0,212,200,' + a + ')';
          ctx.lineWidth = 0.6;
          ctx.stroke();
        }
      }
    }

    /* 粒子点 */
    for(var i = 0; i < pts.length; i++){
      var p = pts[i];
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,212,200,0.5)';
      ctx.fill();
    }

    requestAnimationFrame(loop);
  }
  loop();
})();

/* ===== 拉取 GitHub Release 视频列表 ===== */
function fetchVideos(){
  var headers = { 'Accept': 'application/vnd.github+json' };
  if(CONFIG.token) headers['Authorization'] = 'Bearer ' + CONFIG.token;

  var apiUrl = (CONFIG.tag === 'latest')
    ? 'https://api.github.com/repos/' + CONFIG.repo + '/releases/latest'
    : 'https://api.github.com/repos/' + CONFIG.repo + '/releases/tags/' + CONFIG.tag;

  return fetch(apiUrl, { headers: headers })
    .then(function(res){
      if(!res.ok){
        var msg = 'GitHub API 错误 ' + res.status;
        if(res.status === 404) msg = 'Release 不存在，请先在 GitHub 创建 Release 并上传 .mp4';
        if(res.status === 403) msg = 'API 请求频率超限，请稍后刷新';
        if(res.status === 401) msg = 'Token 无效，请重新生成';
        throw new Error(msg);
      }
      return res.json();
    })
    .then(function(data){
      var assets = (data.assets || []).filter(function(a){
        var n = a.name.toLowerCase();
        return CONFIG.exts.some(function(ext){ return n.slice(-ext.length) === ext; });
      });
      if(assets.length === 0){
        throw new Error(
          'Release "' + data.tag_name + '" 中没有视频文件。\n' +
          '请上传 .mp4 文件到 Release Assets。'
        );
      }
      return assets.map(function(a){
        return { name: a.name, url: a.browser_download_url, size: fmtSize(a.size) };
      });
    });
}

/* ===== 加载第一个视频（原生播放器） ===== */
function loadFirstVideo(list){
  var video = gid('main-video');
  video.src = list[0].url;
  video.load();

  /* 浏览器自动播放策略：先静音自动播放，再尝试解除静音 */
  video.muted = true;
  var p = video.play();
  if(p && typeof p.then === 'function'){
    p.then(function(){
      /* 自动播放成功后，尝试取消静音；若浏览器拒绝则保持静音 */
      var unmuteP = video.play();
      video.muted = false;
      video.volume = 1;
      if(unmuteP && typeof unmuteP.catch === 'function'){
        unmuteP.catch(function(){ video.muted = true; });
      }
    }).catch(function(){
      /* 自动播放被拦截：保持静音播放，用户点击 video 控件即可解锁 */
      video.muted = true;
      video.play().catch(function(){/* 忽略二次失败 */});
    });
  }
}

/* ===== 启动 ===== */
function startPlayback(){
  show('loader', true);
  gid('loader-txt').textContent = '正在读取 GitHub Release…';

  fetchVideos()
    .then(function(list){
      hide('loader');
      show('player-wrap', true);
      loadFirstVideo(list);
    })
    .catch(function(err){
      hide('loader');
      gid('err-msg').textContent = err.message;
      show('error-box', true);
    });
}

/* ===== 未成年提示（不尝试关闭窗口，现代浏览器均会拦截） ===== */
function denyAccess(){
  var box = gid('age-modal');
  box.innerHTML =
    '<div class="modal-box">' +
      '<div class="modal-icon">🚫</div>' +
      '<h2>访问已拒绝</h2>' +
      '<p class="sub">根据相关法律法规，未满18岁用户无法访问本内容。</p>' +
      '<div class="modal-actions">' +
        '<a class="btn btn-no" href="https://www.gov.cn/" target="_self" rel="noopener">离开本页</a>' +
      '</div>' +
    '</div>';
}

/* ===== 入口 ===== */
document.addEventListener('DOMContentLoaded', function(){
  gid('yes-btn').addEventListener('click', function(){
    var modal = gid('age-modal');
    modal.style.transition = 'opacity 0.35s';
    modal.style.opacity    = '0';
    setTimeout(function(){ hide('age-modal'); startPlayback(); }, 350);
  });

  gid('no-btn').addEventListener('click', denyAccess);

  gid('err-reload').addEventListener('click', function(){ location.reload(); });
});
</script>
</body>
</html>
